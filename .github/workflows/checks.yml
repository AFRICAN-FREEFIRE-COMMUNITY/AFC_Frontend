# Every checker on every pull request and every push to any branch.
#
# scripts/check-all.mjs runs the known-bug registry (scripts/known-bugs.json, owner's rule
# 2026-09-11: a bug seen twice gets a checker, a red checker is fixed before anything else) and
# every other catcher (check-datetime, owner's rule R31), and reads scripts/debt-ledger.json
# (owner's rule R32, 2026-09-13): a blocking hit or a debt count that went UP turns the run red;
# --no-write because a pull request never edits the ledger, a commit on the branch does. The same
# runner is the first step of the production build (docker-image-live.yml), so nothing that trips
# it can deploy. Output lines are greppable: KNOWN-BUG <id> <file>:<line>, DATE <file>:<line>.

name: Checks

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  known-bugs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every checker (known-bugs, check-datetime, the debt ledger)
        run: node scripts/check-all.mjs --no-write
